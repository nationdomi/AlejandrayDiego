<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>¡Gracias! — Alejandra y Diego</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

<body>
  <div class="watercolor-bg" aria-hidden="true">

  <main class="hero">

        <span class="line"></span><span class="dot"></span><span class="line"></span>

      <a class="btn-primary" href="index.html">Volver a la invitación</a>

  <script src="script.js"></script>
